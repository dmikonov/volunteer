name: reel-he
on:
  workflow_dispatch:
  push:
    branches: [surftribe-media]
    paths: ['tools/reel/dub/ci/trigger_*.txt']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q torch==2.11.0+cpu torchaudio==2.11.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -q faster-whisper librosa editdistance soundfile gradio_client huggingface_hub opencv-python-headless numpy playwright demucs
          python -m playwright install --with-deps chromium
          sudo mkdir -p /s17 && sudo chown $USER /s17 && cp appkit/Rubik.ttf /s17/Rubik.ttf
      - name: build
        run: python tools/reel/dub/ci/variantB.py
      - name: publish outputs
        if: always()
        run: |
          git config user.name "reel-bot" && git config user.email "reel-bot@users.noreply.github.com"
          git add out || true
          git commit -m "CI: Hebrew 5-things variant B outputs [skip ci]" || exit 0
          git pull --rebase -q origin surftribe-media && git push -q origin HEAD:surftribe-media
