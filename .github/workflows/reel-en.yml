name: reel-en
on:
  workflow_dispatch:
  push:
    branches: [surftribe-media]
    paths: ['tools/reel/dub/ci/en/trigger.txt']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: build
        run: |
          if [ -f tools/reel/dub/ci/en/CANDIDATES ]; then python3 tools/reel/dub/ci/en/candidates.py; else python3 tools/reel/dub/ci/en/introB_en.py; fi
      - name: publish outputs
        if: always()
        run: |
          git config user.name "reel-bot" && git config user.email "reel-bot@users.noreply.github.com"
          git add out || true
          git commit -m "CI: English 5-things variant B outputs [skip ci]" || exit 0
          git pull --rebase -q origin surftribe-media && git push -q origin HEAD:surftribe-media
