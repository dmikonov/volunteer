name: fetch
on:
  workflow_dispatch:
  push:
    branches: [surftribe-media]
    paths: ['tools/fetch/list.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: bash tools/fetch/fetch.sh
      - run: |
          git config user.name "reel-bot" && git config user.email "reel-bot@users.noreply.github.com"
          git add assets || true
          git commit -m "CI: fetched assets [skip ci]" || exit 0
          git pull --rebase -q origin surftribe-media && git push -q origin HEAD:surftribe-media
